name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          # No GEMINI_API_KEY in CI on purpose: the app must build and the
          # AI routes must fail gracefully into mock mode without one —
          # this is the same safety net real users without a key rely on.
          MOCK_AI: "true"
